[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

; Stock board JSON is N8 (8 MB, no PSRAM). These keys select the N16R8 layout:
; 16 MB flash and octal PSRAM. `board_build.flash_size` is not read by this platform.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
; Serial goes to the native USB socket (USB-Serial/JTAG), not the UART socket.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
